services:
  # 1. Database
  db:
    image: postgres:15-alpine
    container_name: cmc_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # 2. Backend (Go API)
  backend:
    build: .
    container_name: cmc_backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # 3. Frontend (Giao diện web)
  frontend:
    build: ./frontend
    container_name: cmc_frontend
    ports:
      - "3000:80" # Máy bạn cổng 3000 -> Container cổng 80 (Chuẩn Nginx)
    depends_on:
      - backend
    restart: always