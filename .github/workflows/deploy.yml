name: Deploy to Production

on:
  push:
    branches: [main, homework]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Run tests
        run: go test -v ./...
      
      - name: Run security checks (Gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104 ./...
  
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build images
        run: docker compose build
      
      - name: Check image sizes
        run: docker images

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homework'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Navigate to app directory
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Pull latest code
            echo "📥 Pulling latest changes..."
            git fetch origin
            git checkout main
            git pull origin main
            
            # Stop old containers
            echo "🛑 Stopping old containers..."
            docker compose down
            
            # Build new images
            echo "🔨 Building new images..."
            docker compose build --no-cache
            
            # Start new containers
            echo "▶️ Starting new containers..."
            docker compose up -d
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to be ready..."
            sleep 10
            
            # Health check
            echo "🏥 Running health checks..."
            if curl -f http://localhost:8080/health; then
              echo "✅ Backend health check passed"
            else
              echo "❌ Backend health check failed"
              docker compose logs backend
              exit 1
            fi
            
            # Print status
            echo "📊 Container status:"
            docker compose ps
            
            echo "✅ Deployment completed successfully!"
      
      - name: Notify Success
        if: success()
        run: echo "✅ Deployment successful!"
      
      - name: Notify Failure
        if: failure()
        run: echo "❌ Deployment failed!"

  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Test API endpoints
        run: |
          sleep 5
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          
          # Test health endpoint
          curl -f https://${DEPLOY_HOST}/health || exit 1
          
          # Test assets endpoint
          curl -f https://${DEPLOY_HOST}/assets || exit 1
          
          echo "✅ All endpoints are healthy"
      
      - name: Create deployment record
        run: |
          echo "Deployment completed at $(date)" 
          echo "Deployed commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
